[package]
name = "eartube"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
cacache = "13.1.0"
dashmap = { version = "6.2.1", features = ["serde"] }
dirs = "6.0.0"
foldhash = "0.2.0"
iced = { version = "0.14.0", features = ["tokio", "debug", "image"] }
iter_tools = "0.50.0"
reqwest = "0.13.4"
rodio = "0.22.2"
rustypipe = "0.11.4"
serde = "1.0.228"
serde_json = "1.0.150"
stream-download = "0.24.1"
tokio = { version = "1.52.3" }

[profile.release]
codegen-units = 1
