[package]
name = "eartube"
version = "0.1.0"
authors = ["brogolem35"]
edition = "2024"
description = "Simple YouTube Music frontend made with Iced."
license = "GPL-3.0"
repository = "https://github.com/Brogolem35/eartube"
keywords = ["youtube", "music", "player", "frontend", "gui"]
categories = ["gui", "multimedia"]

[dependencies]
anyhow = "1.0.104"
cacache = "13.1.0"
dashmap = { version = "6.2.1", features = ["serde"] }
dirs = "6.0.0"
foldhash = "0.2.0"
iced = { version = "0.14.0", features = ["tokio", "debug", "image", "svg", "advanced"] }
iced_aw = "0.14.1"
itertools = "0.15.0"
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
rand = "0.10.2"
reqwest = "0.13.4"
rodio = "0.22.2"
rustypipe = "0.11.4"
serde = "1.0.229"
serde_json = "1.0.151"
souvlaki = { git = "https://github.com/Brogolem35/souvlaki.git" }
stream-download = "0.24.2"
tokio = { version = "1.53.1" }
iced_reorderable = { git = "https://github.com/Brogolem35/iced_reorderable.git" }

[profile.dev.package."*"]
# Disable debug info from 3rd party libs
debug = false
opt-level = 3

[profile.release]
codegen-units = 1

[build-dependencies]
winresource = "0.1.31"
